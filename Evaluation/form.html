<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Donation Form</title>
</head>

<body>
<form action="#" method="post">
    <h2>Donor Information </h2>
<table>
    <tr>
        <td><label for="firstname">First Name: </label></td>
        <td><input type="text" id="firstname" name="firstname" required></td>
    </tr>

    <tr>
        <td><label for="lastname">Last Name: </label></td>
        <td><input type="text" id="lastname" name="lastname" required></td>
    </tr>

    <tr>
        <td><label for="company">Company: </label></td>
        <td><input type="text" id="company" name="company" ></td>
    </tr>

    <tr>
        <td><label for="addrs1">Address 1: </label></td>
        <td><input type="text" id="addrs1" name="addrs1" required></td>
    </tr>

    <tr>
        <td><label for="addrs2">Address 2: </label></td>
        <td><input type="text" id="addrs2" name="addrs2"></td>
    </tr>

    <tr>
        <td><label for="city">City: </label></td>
        <td><input type="text" id="city" name="city" required></td>
    </tr>

    <tr>
        <td><label for="state">State: </label></td>
        <td>
            <select id="state" name="state" required>
                <option value="">Please Select Any</option>
                <option>Dhaka</option>
                <option>Rome</option>
                <option>Madrid</option>
                <option>London</option>
                
            </select>    
        </td>
    </tr>

    <tr>
        <td><label for="zipcode">Zip Code: </label></td>
        <td><input type="number" id="zipcode" name="zipcode" required></td>
    </tr>

    <tr>
        <td><label for="country">Country: </label></td>
        <td>
            <select id="country" name="country" required>
                <option value="">Please Select Any</option>
                <option>Bangladesh</option>
                <option>Italy</option>
                <option>Spain</option>
                <option>UK</option>
                
            </select>    
        </td>
    </tr>

    <tr>
        <td><label for="phone">Phone: </label></td>
        <td><input type="tel" id="phone" name="phone"></td>
    </tr>

    <tr>
        <td><label for="fax">Fax: </label></td>
        <td><input type="tel" id="fax" name="fax"></td>
    </tr>

    <tr>
        <td><label for="email">Email: </label></td>
        <td><input type="email" id="email" name="email" required></td>
    </tr>

    <tr>
        <td>Donation Amount: <br> (Check a button or type in <br> your amount)</td>
        <td>
        <label><input type="radio" name="amount" value="0" checked>None</label>
        <label><input type="radio" name="amount" value="50">$50</label>
        <label><input type="radio" name="amount" value="75">$75</label>
        <label><input type="radio" name="amount" value="100">$100</label>
        <label><input type="radio" name="amount" value="250">$250</label>
        <label><input type="radio" name="amount" value="other">Other</label>
        </td>
    </tr>
    <tr>
        <td></td>
        <td><label for="Otheramount">Other Amount $ </label></td>
        <td><input type="number" id="Otheramount" name="Otheramount"></td>
    </tr>


</table> 
    
<table>
    <tr>
        <td colspan="2"><h2>Honorarium and Memorial Donation Information: </h2></td>
    </tr>
    <tr>
        <td><label>I would like to make <br>this donation: </label></td>
        <td>
            <label><input type="radio" name="hm" value="To Honor">To Honor</label><br>
            <label><input type="radio" name="hm" value="In Memory of">In Memory of</label>
        </td>
    </tr>

    <tr>
        <td><label for="name">Name: </label></td>
        <td><input type="text" id="name" name="name"></td>
    </tr>

    <tr>
        <td><label for="ackname">Acknowledge Donation to: </label></td>
        <td><input type="text" id="ackname" name="ackname"></td>
    </tr>

    <tr>
        <td><label for="addrs">Address: </label></td>
        <td><input type="text" id="addrs" name="addrs"></td>
    </tr>

    <tr>
        <td><label for="honcity">City: </label></td>
        <td><input type="text" id="honcity" name="honcity"></td>
    </tr>

    <tr>
        <td><label for="honstate">State: </label></td>
        <td>
            <select id="honstate" name="honstate">
                <option value="">Please Select Any</option>
                <option>Dhaka</option>
                <option>Rome</option>
                <option>Madrid</option>
                <option>London</option>
                
            </select>    
        </td>
    </tr>

    <tr>
        <td><label for="zip">Zip: </label></td>
        <td><input type="text" id="zip" name="zip"></td>
    </tr>

    <tr>
    <td>
      <input type="reset" value="Reset">
      <input type="submit" value="Continue">
    </td>
  </tr>

</table>
</form>

</body>
</html>
